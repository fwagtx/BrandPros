<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BrandPros render stage</title>
<style>
  @font-face { font-family: "Anton"; src: url(../fonts/Anton-Regular.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Inter"; font-weight: 400; src: url(../fonts/Inter-Regular.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(../fonts/Inter-SemiBold.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Inter"; font-weight: 800; src: url(../fonts/Inter-ExtraBold.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "DM Serif Display"; src: url(../fonts/DMSerifDisplay-Regular.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "DM Serif Display"; font-style: italic; src: url(../fonts/DMSerifDisplay-Italic.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Archivo Black"; src: url(../fonts/Archivo-Black.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Instrument Serif"; src: url(../fonts/InstrumentSerif-Regular.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(../fonts/InstrumentSerif-Italic.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Abril Fatface"; src: url(../fonts/AbrilFatface-Regular.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Libre Baskerville"; font-weight: 700; src: url(../fonts/LibreBaskerville-Bold.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 900; src: url(../fonts/SchibstedGrotesk-Black.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; src: url(../fonts/BricolageGrotesque-ExtraBold.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Instrument Sans"; font-weight: 700; src: url(../fonts/InstrumentSans-Bold.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Big Shoulders Display"; font-weight: 900; src: url(../fonts/BigShouldersDisplay-Black.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Alfa Slab One"; src: url(../fonts/AlfaSlabOne-Regular.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "Permanent Marker"; src: url(../fonts/PermanentMarker-Regular.ttf) format("truetype"); font-display: block; }
  html, body { margin: 0; background: #0E1A2B; }
  #stage { width: 1080px; height: 1920px; overflow: hidden; }
  #stage svg { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="bp-engine.js"></script>
<script src="founders.js"></script>
<script src="logos.js"></script>
<script src="logos2.js"></script>
<script>
  // Render modes: ?asset=avatar|wordmark|wordmark-light|mascot|banner|thumbA|thumbB  or frames of S01 via window.renderAt(t)
  const stage = document.getElementById("stage");
  const q = new URLSearchParams(location.search);
  const assets = {
    avatar: [800, 800, () => BP.avatar()],
    seal: [900, 900, () => BP.sealAsset()],
    wordmark: [1500, 440, () => BP.wordmark(true)],
    "wordmark-light": [1500, 440, () => BP.wordmark(false)],
    mascot: [2000, 1000, () => BP.mascotSheet()],
    banner: [2560, 1440, () => BP.ytBanner()],
    thumbA: [1920, 1080, () => BP.thumbLF01("A")],
    thumbB: [1920, 1080, () => BP.thumbLF01("B")],
    cast: [2100, 1350, () => BP.castSheet()],
  };
  window.renderAt = (t) => { stage.innerHTML = BP.frameS01(t); };
  assets["logo-compare"] = [2000, 1370, () => BP.logoCompare()];
  BP.LOGO_ORDER.forEach((id) => { assets["logo-board-" + id] = [1600, 900, () => BP.logoBoard(id)]; });
  assets["r3-compare"] = [2000, 1220, () => BP.L3.compareSvg()];
  BP.L3.ORDER.forEach((id) => {
    assets["r3-board-" + id] = [1600, 1060, () => BP.L3.boardSvg(id)];
    assets["r3-icon-" + id] = [400, 400, () => BP.L3.iconSvg(id)];
    assets["r3-wordmark-" + id + "-light"] = [1400, 520, () => BP.L3.wordmarkSvg(id, "light")];
    assets["r3-wordmark-" + id + "-dark"] = [1400, 520, () => BP.L3.wordmarkSvg(id, "dark")];
  });
  BP.FOUNDER_ORDER.forEach((id) => { assets["founder-" + id] = [800, 1000, () => BP.founderCard(id)]; });
  window.renderAsset = (name) => {
    const [w, h, fn] = assets[name];
    stage.style.width = w + "px"; stage.style.height = h + "px";
    stage.innerHTML = fn();
    return [w, h];
  };
  window.duration = BP.S01.duration;
  window.ready = Promise.all([
    document.fonts.load("100px Anton"), document.fonts.load("800 60px Inter"),
    document.fonts.load("600 60px Inter"), document.fonts.load("60px 'DM Serif Display'"), document.fonts.load("italic 60px 'DM Serif Display'"), document.fonts.load("40px 'Permanent Marker'"), document.fonts.load("60px 'Archivo Black'"), document.fonts.load("60px 'Instrument Serif'"), document.fonts.load("italic 60px 'Instrument Serif'"), document.fonts.load("60px 'Abril Fatface'"), document.fonts.load("700 60px 'Libre Baskerville'"), document.fonts.load("900 60px 'Schibsted Grotesk'"), document.fonts.load("800 60px 'Bricolage Grotesque'"), document.fonts.load("700 60px 'Instrument Sans'"), document.fonts.load("900 60px 'Big Shoulders Display'"), document.fonts.load("60px 'Alfa Slab One'"),
  ]).then(() => document.fonts.ready);
  if (q.get("asset")) window.renderAsset(q.get("asset")); else window.renderAt(Number(q.get("t") || 1));
</script>
</body>
</html>
