<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Figtree;src:url(../../fonts/figtree.woff2);font-weight:300 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:Figtree,'Noto Color Emoji',sans-serif;background:radial-gradient(ellipse 75% 75% at 50% 42%,#7ee83a 0%,#2f9a1c 100%)}
.stack{position:relative;display:inline-block;font-weight:900;line-height:1;letter-spacing:-4px}
.stack span{display:block;white-space:nowrap}.stack .b{color:#000}.stack .f{position:absolute;left:0;top:0}
.card{position:absolute;width:230px;height:300px;border-radius:24px;border:4px solid rgba(255,255,255,.35);box-shadow:0 18px 36px rgba(0,0,0,.25)}
.card .p{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;color:#111;font-weight:900;font-size:30px;border-radius:10px;padding:2px 12px 5px}
.pill{display:inline-block;font-weight:900;border-radius:20px;white-space:nowrap}
</style></head><body>
<div class="card" style="left:-60px;top:120px;transform:rotate(-12deg);background:radial-gradient(ellipse 80% 75% at 50% 45%,#2fb3f0,#1d5fd6)"><div class="p">1,200</div></div>
<div class="card" style="right:-60px;top:100px;transform:rotate(10deg);background:radial-gradient(ellipse 80% 75% at 50% 45%,#c45cff,#6a1fc4)"><div class="p">1,500</div></div>
<div class="card" style="left:-50px;bottom:60px;transform:rotate(9deg);background:radial-gradient(ellipse 80% 75% at 50% 45%,#ffb347,#c2571a)"><div class="p">2,000</div></div>
<div class="card" style="right:-50px;bottom:80px;transform:rotate(-8deg);background:radial-gradient(ellipse 80% 75% at 50% 45%,#56dde3,#13868f)"><div class="p">800</div></div>
<div style="position:absolute;left:0;right:0;top:120px;text-align:center"><span class="pill" style="background:#fff;color:#111;font-size:62px;padding:12px 30px 18px;transform:rotate(-3deg);box-shadow:0 10px 0 rgba(0,0,0,.3)">¡BIENVENIDOS! 👋</span></div>
<div style="position:absolute;left:0;right:0;top:290px;text-align:center"><div class="stack" style="font-size:300px"><span class="b" style="-webkit-text-stroke:50px #000">BAD</span><span class="f" style="color:#fff">BAD</span></div></div>
<div style="position:absolute;left:0;right:0;top:600px;text-align:center"><span class="pill" style="background:#fff;color:#111;font-size:70px;padding:14px 34px 20px;transform:rotate(-3deg);box-shadow:0 12px 0 rgba(0,0,0,.35)">TIENDA DE HOY 🛒</span></div>
<div style="position:absolute;left:0;right:0;top:790px;text-align:center;color:#fff;font-weight:900;font-size:56px;line-height:1.15;text-shadow:0 5px 0 rgba(0,0,0,.35)">La tienda de Fortnite<br>en 1 minuto, todos los días</div>
<div style="position:absolute;left:0;right:0;top:960px;text-align:center"><span class="pill" style="background:rgba(10,30,10,.78);color:#fff;font-size:44px;padding:12px 26px 16px">⏰ 6:40 PM hora CDMX · nueva tienda</span></div>
<div style="position:absolute;left:0;right:0;top:1060px;text-align:center"><span class="pill" style="background:rgba(10,30,10,.78);color:#fff;font-size:38px;padding:10px 24px 14px">lo nuevo · lo que se va · los lotes con más ahorro</span></div>
<div style="position:absolute;left:0;right:0;top:1170px;text-align:center"><span class="pill" style="background:#e6ff3a;color:#111;font-size:48px;padding:10px 26px 14px;transform:rotate(-2deg);box-shadow:0 8px 0 rgba(0,0,0,.3)">USA EL CÓDIGO: BAD 💚</span><div style="color:#fff;font-weight:800;font-size:26px;margin-top:12px;text-shadow:0 2px 4px rgba(0,0,0,.5)">#EpicPartner</div></div>
</body></html>
