<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Code BAD brand packs: render stage</title>
<style>
  @font-face { font-family: "Bodoni Moda"; font-weight: 900; src: url(../fonts/BodoniModa-1.ttf); font-display: block; }
  @font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 700; src: url(../fonts/BodoniModa-2.ttf); font-display: block; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 800; src: url(../fonts/JetBrainsMono-ExtraBold-1.ttf); font-display: block; }
  @font-face { font-family: "Lilita One"; src: url(../fonts/LilitaOne-Regular-1.ttf); font-display: block; }
  @font-face { font-family: "Nunito"; font-weight: 900; src: url(../fonts/Nunito-Black-1.ttf); font-display: block; }
  @font-face { font-family: "Inter"; font-weight: 400; src: url(../fonts/Inter-Regular.ttf); font-display: block; }
  @font-face { font-family: "Inter"; font-weight: 800; src: url(../fonts/Inter-ExtraBold.ttf); font-display: block; }
  @font-face { font-family: "Archivo Black"; src: url(../fonts/Archivo-Black.ttf); font-display: block; }
  @font-face { font-family: "Permanent Marker"; src: url(../fonts/PermanentMarker-Regular.ttf); font-display: block; }
  html, body { margin: 0; background: #222; }
  #stage { position: relative; overflow: hidden; }
  #stage * { box-sizing: border-box; }
</style>
<link rel="stylesheet" href="packs.css">
</head>
<body>
<div id="stage"></div>
<script src="packs.js"></script>
<script>
  const stage = document.getElementById("stage");
  window.renderAsset = (name) => {
    const [w, h, html] = PACKS.asset(name);
    stage.style.width = w + "px"; stage.style.height = h + "px";
    stage.innerHTML = html;
    return [w, h];
  };
  window.assetNames = () => PACKS.names();
  window.ready = Promise.all([
    "900 80px 'Bodoni Moda'", "italic 700 80px 'Bodoni Moda'", "800 80px 'JetBrains Mono'", "80px 'Lilita One'",
    "900 80px Nunito", "400 40px Inter", "800 40px Inter", "80px 'Archivo Black'", "40px 'Permanent Marker'",
  ].map((f) => document.fonts.load(f))).then(() => document.fonts.ready);
  const q = new URLSearchParams(location.search);
  if (q.get("asset")) window.renderAsset(q.get("asset"));
</script>
</body>
</html>
